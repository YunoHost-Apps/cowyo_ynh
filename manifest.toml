#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cowyo"
name = "Cowyo"
description.en = "Feature-rich wiki webserver, pastebin for minimalists"
description.fr = "Serveur de wiki, pastebin minimaliste et riche en fonctionnalités"

version = "3.0.1~ynh1"

maintainers = ["tituspijean"]

[upstream]
license = "MIT"
demo = "https://cowyo.com"
userdoc = "https://cowyo.com/about"
code = "https://github.com/schollz/cowyo"
fund = "https://github.com/sponsors/schollz"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/schollz/cowyo/archive/refs/tags/v3.0.1.tar.gz"
        sha256 = "f901a4499327c09de1bebee9c00bc1e476b85fb8ca35d0459e18f60da5558083"
        autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"

    [resources.database]
    type = "postgresql"

    [resources.go]
    version = "1.26.5"

    [resources.nodejs]
    version = "24"

    [resources.apt]
    packages = ["yq"]
